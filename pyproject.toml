# Keep rules focused on correctness, then progressively widen coverage.
target-version = "py311"
line-length = 100
extend-exclude = [".idea"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Module snippets are intentionally imported by the Streamlit dashboard.
"__init__.py" = ["F401"]
