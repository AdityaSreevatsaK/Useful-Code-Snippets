name: Validate Python utilities

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest Pillow PyPDF2 pdf2image nbformat nbconvert cryptography
      - name: Compile all Python code
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_integration_runtime.py
