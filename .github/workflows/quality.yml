name: Validate Python utilities

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff Pillow pypdf pdf2image nbformat nbconvert cryptography requests fastapi uvicorn python-multipart httpx
      - name: Check Python lint rules
        run: ruff check . --select E4,E7,E9,F --output-format=github
      - name: Check frontend JavaScript syntax
        run: node --check web/assets/app.js
      - name: Compile all Python code
        run: python -m compileall -q .
      - name: Run tests
        run: python -m pytest -q --ignore=tests/test_integration_runtime.py
