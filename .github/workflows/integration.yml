name: Full runtime integration smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  linux-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system converters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils libreoffice-writer espeak-ng libespeak1 libportaudio2 libgl1 ffmpeg
      - name: Install complete application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pip check
      - name: Exercise conversions, API and frontend
        run: |
          python -m pip install httpx
          python -m pytest -q tests/test_integration_runtime.py tests/test_web_api.py

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker runtime
        run: docker build --tag utility-shelf:ci .
      - name: Launch API container and verify readiness
        run: |
          docker run --detach --name utility-shelf-ci --publish 7860:7860 utility-shelf:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:7860/api/health; then
              ready=1
              break
            fi
            if [ -z "$(docker ps --quiet --filter name=utility-shelf-ci)" ]; then
              echo "Container exited prematurely"
              docker logs utility-shelf-ci
              exit 1
            fi
            sleep 5
          done
          docker logs --tail 70 utility-shelf-ci
          curl --fail --silent http://127.0.0.1:7860/api/tools | python -c 'import json,sys; assert len(json.load(sys.stdin)["tools"]) == 34'
          curl --fail --silent http://127.0.0.1:7860/ | grep -q 'Utility Shelf'
          curl --fail --silent http://127.0.0.1:7860/assets/app.js | grep -q 'Utility Shelf v3'
          if [ "$ready" -ne 1 ]; then
            echo "FastAPI did not become healthy"
            exit 1
          fi
